# About Section
about_title: Research Interests
# about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  My research background centers on probing electronic band topology and Berry curvature through resistivity, Hall effect, magnetic torque, and high-pressure measurements.

  Looking forward, I aim to incorporate highly resolvable techniques—such as scanning NV-center magnetometry for local magnetic mapping, and NMR or thermal transport for detecting symmetry breaking—to explore unexplained physical phenomena.

  Ultimately, my goal is to drive impactful research that contributes to human well-being, with a specific focus on understanding superconductivity and identifying applicable novel magnetic states.

